apiVersion: v1
kind: Secret
metadata:
  name: modular-backend-lab-secrets
  labels:
    app.kubernetes.io/name: modular-backend-lab
    app.kubernetes.io/part-of: modular-backend-lab
type: Opaque
stringData:
