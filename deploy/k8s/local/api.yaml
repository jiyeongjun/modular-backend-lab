apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: modular-backend-lab
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: modular-backend-lab
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app.kubernetes.io/name: modular-backend-lab
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: modular-backend-lab
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: modular-backend-lab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: modular-backend-lab
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modular-backend-lab
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: modular-backend-lab
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: modular-backend-lab:local
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/main.js
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: modular-backend-lab-config
            - secretRef:
                name: modular-backend-lab-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: modular-backend-lab-api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  labels:
    app.kubernetes.io/name: modular-backend-lab
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: modular-backend-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modular-backend-lab
      app.kubernetes.io/component: api
