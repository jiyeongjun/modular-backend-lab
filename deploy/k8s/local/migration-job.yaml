apiVersion: batch/v1
kind: Job
metadata:
  name: modular-backend-lab-migration
  labels:
    app.kubernetes.io/name: modular-backend-lab
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: modular-backend-lab
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modular-backend-lab
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: modular-backend-lab
    spec:
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: modular-backend-lab:local
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/infra/db/migrator.js
            - up
          envFrom:
            - configMapRef:
                name: modular-backend-lab-config
            - secretRef:
                name: modular-backend-lab-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: modular-backend-lab-migration
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
