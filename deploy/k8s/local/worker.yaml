apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: modular-backend-lab
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: modular-backend-lab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app.kubernetes.io/name: modular-backend-lab
      app.kubernetes.io/component: worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modular-backend-lab
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: modular-backend-lab
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: modular-backend-lab:local
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/workers/outbox-worker.js
          envFrom:
            - configMapRef:
                name: modular-backend-lab-config
            - secretRef:
                name: modular-backend-lab-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: modular-backend-lab-worker
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
